// ---------- helpers (plan x → X, plan y (back→front) → Z, up → Y) ----------
const PITCH = 5 / 12, EAVE = 16, RIDGE = EAVE + 20 * PITCH;

function box(x, y, z, w, h, d, mat, parent = g, shadow = true) {

// wall along X (y=const) from x1..x2, with openings [{a,b,sill,head}]
function wallX(z, x1, x2, h, t, openings = [], mat = M.wall, parent = g, gable = false) {
  const segs = [{ a: x1, b: x2 }];
  const ops = [...openings].sort((p, q) => p.a - q.a);
  let cur = x1;

    if (o.a > cur) solid(cur, o.a);
    // below sill & above head
    if (o.sill > 0) box(o.a, 0, z - t / 2, o.b - o.a, o.sill, t, mat, parent);

}

}

box(-0.6, 0, -0.6, 0.1, 16, 61.2, M.ext, g, false); box(40.5, 0, -0.6, 0.1, 16, 61.2, M.ext, g, false);

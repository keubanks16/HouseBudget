<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 800);
const controls = new OrbitControls(camera, canvas); controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxPolarAngle = Math.PI * 0.98;
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

// ================= procedural textures =================
function tex(w, h, draw, rx = 1, ry = 1, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); draw(x, w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function rnd(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function noise(x, w, h, base, amt, seed = 7) {
  const r = rnd(seed); const img = x.getImageData(0, 0, w, h); const d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * amt; d[i] = Math.max(0, Math.min(255, d[i] + n)); d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n)); d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n)); }
  x.putImageData(img, 0, 0);
}
// wood planks: tile = 4' x 4', planks 6" wide along Y
const T = {};
T.floor = tex(512, 512, (x, w, h) => {
  const r = rnd(3); x.fillStyle = '#a97f52'; x.fillRect(0, 0, w, h);
  const pw = w / 8;
  for (let i = 0; i < 8; i++) {
    const hue = 28 + r() * 8, lum = 42 + r() * 14; x.fillStyle = `hsl(${hue},45%,${lum}%)`; x.fillRect(i * pw, 0, pw, h);
    for (let k = 0; k < 40; k++) { x.strokeStyle = `rgba(60,30,10,${0.08 + r() * 0.12})`; x.lineWidth = 0.6 + r() * 1.2; x.beginPath(); const yy = r() * h; x.moveTo(i * pw, yy); x.bezierCurveTo(i * pw + pw * 0.3, yy + (r() - .5) * 20, i * pw + pw * 0.7, yy + (r() - .5) * 20, i * pw + pw, yy + (r() - .5) * 10); x.stroke(); }
    x.fillStyle = 'rgba(0,0,0,0.35)'; x.fillRect(i * pw, 0, 1.5, h);
    const seam = r() * h; x.fillRect(i * pw, seam, pw, 1.5);
  }
  noise(x, w, h, 0, 18, 5);
});
T.ceil = tex(512, 512, (x, w, h) => {   // T&G boards 6" across the tile (8 boards per 4')
  const r = rnd(11); x.fillStyle = '#c99a62'; x.fillRect(0, 0, w, h); const bw = w / 8;
  for (let i = 0; i < 8; i++) { x.fillStyle = `hsl(${30 + r() * 6},50%,${52 + r() * 10}%)`; x.fillRect(i * bw, 0, bw, h); for (let k = 0; k < 30; k++) { x.strokeStyle = `rgba(90,50,20,${0.08 + r() * 0.1})`; x.lineWidth = 0.8; x.beginPath(); const yy = r() * h; x.moveTo(i * bw, yy); x.lineTo(i * bw + bw, yy + (r() - .5) * 8); x.stroke(); } x.fillStyle = 'rgba(0,0,0,0.3)'; x.fillRect(i * bw, 0, 1.2, h); }
  noise(x, w, h, 0, 14, 9);
});
T.bb = tex(256, 512, (x, w, h) => {      // board & batten: 2 boards per 2' tile
  x.fillStyle = '#23262b'; x.fillRect(0, 0, w, h); noise(x, w, h, 0, 10, 2);
  for (const bx of [0, w / 2]) { x.fillStyle = '#2d3137'; x.fillRect(bx, 0, 18, h); x.fillStyle = '#1a1c20'; x.fillRect(bx + 18, 0, 3, h); }
});
T.tile = tex(512, 512, (x, w, h) => {    // 12" tiles, tile = 4'
  x.fillStyle = '#b9b3a8'; x.fillRect(0, 0, w, h); const r = rnd(21);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { x.fillStyle = `hsl(35,${8 + r() * 6}%,${78 + r() * 8}%)`; x.fillRect(i * 128 + 3, j * 128 + 3, 122, 122); }
  noise(x, w, h, 0, 10, 4);
});
T.conc = tex(512, 512, (x, w, h) => { x.fillStyle = '#b8b2a8'; x.fillRect(0, 0, w, h); noise(x, w, h, 0, 30, 8); const r = rnd(5); for (let k = 0; k < 400; k++) { x.fillStyle = `rgba(0,0,0,${r() * 0.12})`; x.fillRect(r() * w, r() * h, 2, 2); } });
T.wall = tex(256, 256, (x, w, h) => { x.fillStyle = '#efebe3'; x.fillRect(0, 0, w, h); noise(x, w, h, 0, 8, 13); });
T.stone = tex(512, 512, (x, w, h) => {
  const r = rnd(77); x.fillStyle = '#5e574d'; x.fillRect(0, 0, w, h); let y = 0;
  while (y < h) { const rh = 40 + r() * 50; let xx = -r() * 60; while (xx < w) { const rw = 70 + r() * 110; x.fillStyle = `hsl(${30 + r() * 15},${10 + r() * 12}%,${48 + r() * 18}%)`; x.beginPath(); x.roundRect(xx + 3, y + 3, rw - 6, rh - 6, 6); x.fill(); xx += rw; } y += rh; }
  noise(x, w, h, 0, 22, 3);
});
T.fabric = tex(256, 256, (x, w, h) => { x.fillStyle = '#d6cfc0'; x.fillRect(0, 0, w, h); noise(x, w, h, 0, 26, 17); }, 4, 4);
T.rug = tex(512, 512, (x, w, h) => {
  x.fillStyle = '#b39b7e'; x.fillRect(0, 0, w, h); x.strokeStyle = '#7a6752'; x.lineWidth = 6; x.strokeRect(20, 20, w - 40, h - 40); x.lineWidth = 2; x.strokeRect(40, 40, w - 80, h - 80);
  x.fillStyle = '#8c7760'; for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) { x.beginPath(); x.ellipse(70 + i * 75, 70 + j * 75, 18, 10, (i + j) % 2 ? 0.8 : -0.8, 0, Math.PI * 2); x.fill(); }
  noise(x, w, h, 0, 20, 23);
});
T.gravel = tex(256, 256, (x, w, h) => { x.fillStyle = '#8f8b84'; x.fillRect(0, 0, w, h); const r = rnd(9); for (let k = 0; k < 1500; k++) { x.fillStyle = `hsl(${30 + r() * 30},6%,${40 + r() * 40}%)`; x.beginPath(); x.arc(r() * w, r() * h, 1 + r() * 2.5, 0, 7); x.fill(); } });
T.grass = tex(256, 256, (x, w, h) => { x.fillStyle = '#6a8646'; x.fillRect(0, 0, w, h); noise(x, w, h, 0, 40, 31); });
T.cab = tex(256, 512, (x, w, h) => { x.fillStyle = '#3c4844'; x.fillRect(0, 0, w, h); x.strokeStyle = '#2a3431'; x.lineWidth = 4; x.strokeRect(14, 14, w - 28, h - 28); x.strokeStyle = '#4a5752'; x.lineWidth = 1.5; x.strokeRect(22, 22, w - 44, h - 44); });
T.cabW = tex(256, 512, (x, w, h) => { x.fillStyle = '#e8e2d6'; x.fillRect(0, 0, w, h); x.strokeStyle = '#cfc8ba'; x.lineWidth = 4; x.strokeRect(14, 14, w - 28, h - 28); x.strokeStyle = '#f4f0e8'; x.lineWidth = 1.5; x.strokeRect(22, 22, w - 44, h - 44); });
T.quartz = tex(512, 512, (x, w, h) => { x.fillStyle = '#f1ede4'; x.fillRect(0, 0, w, h); const r = rnd(41); for (let k = 0; k < 25; k++) { x.strokeStyle = `rgba(150,140,125,${0.15 + r() * 0.2})`; x.lineWidth = 1 + r() * 3; x.beginPath(); x.moveTo(r() * w, r() * h); x.bezierCurveTo(r() * w, r() * h, r() * w, r() * h, r() * w, r() * h); x.stroke(); } noise(x, w, h, 0, 6, 2); });
T.timber = tex(256, 1024, (x, w, h) => { const r = rnd(55); x.fillStyle = '#b07d48'; x.fillRect(0, 0, w, h); for (let k = 0; k < 120; k++) { x.strokeStyle = `rgba(80,45,15,${0.1 + r() * 0.15})`; x.lineWidth = 0.8 + r() * 1.5; x.beginPath(); const xx = r() * w; x.moveTo(xx, 0); x.bezierCurveTo(xx + (r() - .5) * 20, h / 3, xx + (r() - .5) * 20, 2 * h / 3, xx + (r() - .5) * 10, h); x.stroke(); } noise(x, w, h, 0, 14, 6); });

function mapped(t, rx, ry) { const c = t.clone(); c.repeat.set(rx, ry); c.needsUpdate = true; return c; }
const M = {
  wall: new THREE.MeshStandardMaterial({ map: mapped(T.wall, 4, 4), roughness: 0.95 }),
  ext: new THREE.MeshStandardMaterial({ map: mapped(T.bb, 20, 1), roughness: 0.75, metalness: 0.15 }),
  conc: new THREE.MeshStandardMaterial({ map: mapped(T.conc, 6, 6), roughness: 0.92 }),
  timber: new THREE.MeshStandardMaterial({ map: mapped(T.timber, 1, 1), roughness: 0.7 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x2a2e34, roughness: 0.45, metalness: 0.6 }),
  roofTop: new THREE.MeshStandardMaterial({ color: 0x1c1f24, roughness: 0.4, metalness: 0.5 }),
  frame: new THREE.MeshStandardMaterial({ color: 0x141618, roughness: 0.55, metalness: 0.3 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xdfeefa, transmission: 0.92, transparent: true, opacity: 0.6, roughness: 0.03, thickness: 0.05, side: THREE.DoubleSide, envMapIntensity: 1.2 }),
  cab: new THREE.MeshStandardMaterial({ map: mapped(T.cab, 1, 1), roughness: 0.55 }),
  cabW: new THREE.MeshStandardMaterial({ map: mapped(T.cabW, 1, 1), roughness: 0.55 }),
  top: new THREE.MeshStandardMaterial({ map: mapped(T.quartz, 1, 1), roughness: 0.18, metalness: 0.05 }),
  appl: new THREE.MeshStandardMaterial({ color: 0xb9bec3, roughness: 0.3, metalness: 0.85 }),
  black: new THREE.MeshStandardMaterial({ color: 0x1b1d1f, roughness: 0.5, metalness: 0.4 }),
  stone: new THREE.MeshStandardMaterial({ map: mapped(T.stone, 1, 1), roughness: 0.95 }),
  fabric: new THREE.MeshStandardMaterial({ map: T.fabric, roughness: 1 }),
  fabric2: new THREE.MeshStandardMaterial({ map: T.fabric, color: 0x8a9a7a, roughness: 1 }),
  leather: new THREE.MeshStandardMaterial({ color: 0x6b4a32, roughness: 0.6 }),
  linen: new THREE.MeshStandardMaterial({ color: 0xf2eee6, roughness: 0.95 }),
  pillow: new THREE.MeshStandardMaterial({ color: 0x7e8a70, roughness: 1 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x3a3632, roughness: 0.8 }),
  rail: new THREE.MeshStandardMaterial({ color: 0x1e2124, roughness: 0.4, metalness: 0.7 }),
  fire: new THREE.MeshStandardMaterial({ color: 0xffa040, emissive: 0xff6a10, emissiveIntensity: 2.2 }),
  bulb: new THREE.MeshStandardMaterial({ color: 0xffe9c0, emissive: 0xffd080, emissiveIntensity: 3 }),
  grass: new THREE.MeshStandardMaterial({ map: mapped(T.grass, 60, 60), roughness: 1 }),
  gravel: new THREE.MeshStandardMaterial({ map: mapped(T.gravel, 8, 12), roughness: 1 }),
  tree: new THREE.MeshStandardMaterial({ color: 0x3f6b35, roughness: 1 }),
  trunk: new THREE.MeshStandardMaterial({ color: 0x5a4330, roughness: 1 }),
  white: new THREE.MeshStandardMaterial({ color: 0xf6f3ee, roughness: 0.8 }),
  tv: new THREE.MeshStandardMaterial({ color: 0x0b0d10, roughness: 0.25, metalness: 0.5 }),
};
function floorMat(w, d, t = T.floor, per = 4) { return new THREE.MeshStandardMaterial({ map: mapped(t, w / per, d / per), roughness: 0.65 }); }
function tileMat(w, d) { return new THREE.MeshStandardMaterial({ map: mapped(T.tile, w / 4, d / 4), roughness: 0.35 }); }
function ceilMat(w, d) { return new THREE.MeshStandardMaterial({ map: mapped(T.ceil, w / 4, d / 4), roughness: 0.7, side: THREE.DoubleSide }); }

// ================= geometry helpers =================
const PITCH = 5 / 12, EAVE = 16, RIDGE = EAVE + 20 * PITCH, roofH = x => EAVE + (20 - Math.abs(x - 20)) * PITCH;
const g = new THREE.Group(); scene.add(g);
const roofG = new THREE.Group(); g.add(roofG);
const loftG = new THREE.Group(); g.add(loftG);
function box(x, y, z, w, h, d, mat, parent = g, shadow = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x + w / 2, y + h / 2, z + d / 2); m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m;
}
function rbox(x, y, z, w, h, d, mat, r = 0.15, parent = g) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2, h / 2, d / 2)), mat);
  m.position.set(x + w / 2, y + h / 2, z + d / 2); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
function cyl(x, y, z, r, h, mat, parent = g, rt = r) { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, r, h, 24), mat); m.position.set(x, y + h / 2, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; }
// exterior wall boxes: outside face in board & batten.  BoxGeometry face order: +x,-x,+y,-y,+z,-z
function extMat(face) { const a = [M.wall, M.wall, M.wall, M.wall, M.wall, M.wall]; a[{ '+x': 0, '-x': 1, '+z': 4, '-z': 5 }[face]] = M.ext; return a; }
function wallX(z, x1, x2, h, t, openings = [], ext = null, gable = false) {
  const mat = ext ? extMat(ext) : M.wall;
  const ops = [...openings].sort((p, q) => p.a - q.a); let cur = x1;
  const solid = (a, b) => gable ? gableWall(z, a, b, 0, t, ext) : box(a, 0, z - t / 2, b - a, h, t, mat);
  for (const o of ops) {
    if (o.a > cur) solid(cur, o.a);
    if (o.sill > 0) box(o.a, 0, z - t / 2, o.b - o.a, o.sill, t, mat);
    if (gable) gableWall(z, o.a, o.b, o.head, t, ext); else box(o.a, o.head, z - t / 2, o.b - o.a, h - o.head, t, mat);
    cur = o.b;
  }
  if (cur < x2) solid(cur, x2);
}
function gableWall(z, a, b, bottom, t, ext) {
  const s = new THREE.Shape(); s.moveTo(a, bottom); s.lineTo(b, bottom); s.lineTo(b, roofH(b));
  if (a < 20 && b > 20) s.lineTo(20, roofH(20)); s.lineTo(a, roofH(a)); s.lineTo(a, bottom);
  const geo = new THREE.ExtrudeGeometry(s, { depth: t, bevelEnabled: false });
  // extrude: group 0 = caps (front/back), group 1 = sides.  front cap is at +z of the shape.
  let mats = [M.wall, M.wall];

  const m = new THREE.Mesh(geo, mats); m.position.z = z - t / 2; m.castShadow = m.receiveShadow = true; g.add(m);

function wallZ(x, z1, z2, h, t, openings = [], ext = null) {
  const mat = ext ? extMat(ext) : M.wall;
  const ops = [...openings].sort((p, q) => p.a - q.a); let cur = z1;
  for (const o of ops) {
    if (o.a > cur) box(x - t / 2, 0, cur, t, h, o.a - cur, mat);
    if (o.sill > 0) box(x - t / 2, 0, o.a, t, o.sill, o.b - o.a, mat);

function windowX(z, a, b, sill, head, cols = 2, rows = 3) {
  const w = b - a, h = head - sill, f = 0.2;
  box(a - 0.1, sill - 0.1, z - 0.14, w + 0.2, f, 0.28, M.frame); box(a - 0.1, head - 0.1, z - 0.14, w + 0.2, f, 0.28, M.frame);
  box(a - 0.1, sill, z - 0.14, f, h, 0.28, M.frame); box(b - 0.1, sill, z - 0.14, f, h, 0.28, M.frame);
  for (let i = 1; i < cols; i++) box(a + w * i / cols - 0.06, sill, z - 0.1, 0.12, h, 0.2, M.frame, g, false);
  for (let j = 1; j < rows; j++) box(a, sill + h * j / rows - 0.06, z - 0.1, w, 0.12, 0.2, M.frame, g, false);
  const gl = new THREE.Mesh(new THREE.PlaneGeometry(w, h), M.glass); gl.position.set(a + w / 2, sill + h / 2, z); g.add(gl);

}
function windowZ(x, a, b, sill, head, cols = 2, rows = 3) {
  const w = b - a, h = head - sill, f = 0.2;
  box(x - 0.14, sill - 0.1, a - 0.1, 0.28, f, w + 0.2, M.frame); box(x - 0.14, head - 0.1, a - 0.1, 0.28, f, w + 0.2, M.frame);
  box(x - 0.14, sill, a - 0.1, 0.28, h, f, M.frame); box(x - 0.14, sill, b - 0.1, 0.28, h, f, M.frame);
  for (let i = 1; i < cols; i++) box(x - 0.1, sill, a + w * i / cols - 0.06, 0.2, h, 0.12, M.frame, g, false);
  for (let j = 1; j < rows; j++) box(x - 0.1, sill + h * j / rows - 0.06, a, 0.2, 0.12, w, M.frame, g, false);
  const gl = new THREE.Mesh(new THREE.PlaneGeometry(w, h), M.glass); gl.rotation.y = Math.PI / 2; gl.position.set(x, sill + h / 2, a + w / 2); g.add(gl);
}
function stripX(pts, z, t, mat = M.frame) { const sh = new THREE.Shape(); pts.forEach(([x, y], i) => i ? sh.lineTo(x, y) : sh.moveTo(x, y)); const m = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: t, bevelEnabled: false }), mat); m.position.z = z - t / 2; m.castShadow = m.receiveShadow = true; g.add(m); return m; }
function paneX(pts, z) { const sh = new THREE.Shape(); pts.forEach(([x, y], i) => i ? sh.lineTo(x, y) : sh.moveTo(x, y)); const m = new THREE.Mesh(new THREE.ShapeGeometry(sh), M.glass); m.position.z = z; g.add(m); return m; }
function trapX(z, a, b, yb, ta, tb, cols = 4) {
  const f = 0.2; paneX([[a, yb], [b, yb], [b, tb], [a, ta]], z);
